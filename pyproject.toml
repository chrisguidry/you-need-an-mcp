[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "you-need-an-mcp"
version = "0.1.0"
description = "MCP server for YNAB (You Need A Budget)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["fastmcp>=4.1.3", "pydantic>=2.11.5", "ynab>=4.4.1,<5"]

[project.scripts]
you-need-an-mcp = "server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = [
    "accounts.py",
    "assignments.py",
    "categories.py",
    "currency.py",
    "effects.py",
    "months.py",
    "pagination.py",
    "payees.py",
    "plan.py",
    "recurrence.py",
    "repository.py",
    "scheduled_entry.py",
    "scheduled_transactions.py",
    "server.py",
    "transaction_entry.py",
    "transactions.py",
    "ynab_errors.py",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.7.0",
    "pytest-env>=1.1.5",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = [
    "--cov",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    "--strict-markers",
    "--strict-config",
    "-Werror",
    # py-key-value-aio runs beartype on its own classes under pytest, and
    # beartype calls isinstance() on their AsyncKeyValue protocol, which is
    # not @runtime_checkable.  Python 3.15 deprecates that call, so beartype
    # skips those classes and warns that it did.  Only py-key-value-aio
    # brings beartype in, so the whole category is safe to ignore.
    "-Wignore::beartype.roar.BeartypeClawDecorWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
env = [
    "YNAB_PLAN=test_plan_id",
    "YNAB_ACCESS_TOKEN=test_token_123",
]

[tool.coverage.run]
source = ["."]
omit = [".venv/*"]

[tool.mypy]
python_version = "3.15"
strict = true

[[tool.mypy.overrides]]
module = ["ynab", "ynab.*"]
implicit_reexport = true

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (enforce modern python syntax)
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["ids.uid", "fastmcp.dependencies.Shared"]
