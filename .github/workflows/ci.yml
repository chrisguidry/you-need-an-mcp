name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files
      - run: uv run pytest

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The GitHub Actions cache backend of buildx reads these variables
      # from the environment, and a plain run step does not receive them.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # docker-bake.hcl holds the tags, platforms, labels, and annotations, so
      # this build is the one `docker buildx bake` makes on a laptop. The
      # commit's committer time sets SOURCE_DATE_EPOCH, which BuildKit uses as
      # the image's creation time.
      - name: Build and push the image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          REVISION="$(git rev-parse HEAD)"
          VERSION="$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"
          CREATED="$(git log -1 --format=%cI)"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export REVISION VERSION CREATED SOURCE_DATE_EPOCH
          docker buildx bake --push
